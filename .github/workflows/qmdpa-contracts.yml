name: QM/DPA interface contracts

on:
  push:
    branches: ['qmdpa/**']
    paths: ['tools/qmdpa/**', '.github/workflows/qmdpa-contracts.yml']
  pull_request:
    paths: ['tools/qmdpa/**', '.github/workflows/qmdpa-contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install './tools/qmdpa[test]'
      - name: Lint and pure interface tests
        run: |
          python -m ruff check --select E4,E7,E9,F,I tools/qmdpa
          python -m pytest tools/qmdpa/tests -q
