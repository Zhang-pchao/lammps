# GitHub action to run checks from tools/coding_standard
name: "Check for Programming Style Conformance"

on:
  push:
    branches:
      - develop
      - maintenance
  pull_request:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

jobs:
  build:
    name: Programming Style Conformance
    if: >-
      ${{ github.repository == 'lammps/lammps' ||
          (github.repository == 'Zhang-pchao/lammps' &&
           github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/mixpimd/main') }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Run Tests
      working-directory: src
      shell: bash
      run: |
         make check-whitespace
         make check-permissions
         make check-homepage
         make check-errordocs
         make check-fmtlib
