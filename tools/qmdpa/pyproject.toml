[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lammps-qmdpa"
version = "0.4.0.dev4"
description = "Explicit energy and force coupling of quantum providers and DeePMD in LAMMPS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}
authors = [{name = "Pengchao Zhang", email = "pczhang1997@gmail.com"}]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
qm = ["pyscf>=2.8"]
mpi = ["mpi4py>=3.1"]
test = ["pytest>=7", "ruff"]

[project.scripts]
qmdpa = "qmdpa.cli:main"

[tool.setuptools.packages.find]
include = ["qmdpa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires actual external backends or LAMMPS"]

[tool.ruff]
line-length = 100
target-version = "py310"
